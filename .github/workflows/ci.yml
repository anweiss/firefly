name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: coordinator

  firefly-fw-fmt:
    name: firefly-fw rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: firefly-fw

  firefly-fw-clippy:
    name: firefly-fw clippy + build (esp32c3)
    runs-on: ubuntu-latest
    env:
      # Required at build time by firefly-fw/src/wifi.rs (env! macros).
      # Real credentials live only on the device — CI uses placeholders.
      WIFI_SSID: ci-firefly
      WIFI_PASS: ci-firefly-pass
    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF host build dependencies
        run: |
          # Drop third-party apt sources that often have transient sync issues
          # on GitHub-hosted runners (e.g. dl.google.com chrome-stable). We
          # don't need them for this build.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0
      # esp-rs canonical action: installs the Rust ESP toolchain and
      # ldproxy linker shim for the requested ESP target. Despite the
      # name "xtensa-toolchain" it also sets up RISC-V (esp32c3/c6/h2).
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32c3
          ldproxy: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firefly-fw
          cache-on-failure: true
          # esp-idf-sys downloads the ESP-IDF C SDK (~1 GB) into
          # ~/.cargo's checkout dirs the first time. Cache those across
          # runs to keep cold CI build under ~5 minutes.
          shared-key: firefly-fw-esp32c3
      - name: Clippy (lint + cross-compile to riscv32imc-esp-espidf)
        run: cargo clippy --release --all-targets -- -D warnings
        working-directory: firefly-fw

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: coordinator
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: coordinator

  coordinator-tests:
    name: Coordinator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list && sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: coordinator
      - run: cargo test --all-features
        working-directory: coordinator

  firmware-tests:
    name: Firmware tests (C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I shared -o tests/test_firmware tests/test_firmware.cpp
          ./tests/test_firmware

  arduino-compile:
    name: Arduino compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 board package and libraries
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli lib install FastLED "Adafruit GFX Library" "Adafruit SSD1306"
      - name: Compile dongle firmware
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C3 dongle-firmware/
      - name: Compile wristband firmware
        run: arduino-cli compile --fqbn esp32:esp32:XIAO_ESP32C3 wristband-firmware/
