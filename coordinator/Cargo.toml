[package]
name = "firefly-coordinator"
version = "0.2.0"
edition = "2021"
description = "DJ Link + Ableton Link → ESP-NOW bridge coordinator for Firefly wristbands"

[dependencies]
ableton-link-rs = { git = "https://github.com/anweiss/ableton-link-rs.git", branch = "main" }
prodjlink-rs = { git = "https://github.com/anweiss/prodjlink-rs.git", branch = "main" }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serialport = "4.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crc = "3"
ctrlc = "3"
