[package]
name = "firefly-coordinator"
version = "0.2.0"
edition = "2021"
description = "DJ Link + Ableton Link → ESP-NOW bridge coordinator for Firefly wristbands"

[dependencies]
ableton-link-rs = { path = "../../ableton-link-rs" }
prodjlink-rs = { path = "../../prodjlink-rs" }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serialport = "4.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
crc = "3"
ctrlc = "3"
